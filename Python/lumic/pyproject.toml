[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lumic"
version = "0.1.0rc2"
description = "Spectral unmixing tools for fluorescence microscopy"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Lumic contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "scikit-image>=0.25",
    "tqdm>=4.66",
    "lxml>=4.9.2",
    "pylibCZIrw>=6.1.0",
    "ome-types>=0.6.3,<0.7",
    "tifffile>=2026.9.20,<2027",
    "imagecodecs>=2026.8.16",
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.9"]
fpbase = ["fpbase==0.1.3"]
examples = [
    "matplotlib>=3.9",
    "jupyterlab",
    "ipykernel",
    "pandas",
    "multiprocess",
    "threadpoolctl",
]
test = ["pytest"]
# Keep the combined install in sync with the individual extras above.
all = ["lumic[visualization,fpbase,examples,test]"]

[project.urls]
Repository = "https://github.com/CCI-GU-Sweden/lumic"

[tool.setuptools]
# Keep the existing import package and build project in the same directory.
package-dir = {lumic = "."}
packages = ["lumic", "lumic.evaluation", "lumic.simulation"]
include-package-data = false

[tool.setuptools.package-data]
"lumic.simulation" = ["fpbase_data/*.csv", "fpbase_data/README.md"]
