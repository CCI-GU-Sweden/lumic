name: Build plugin release

on:
  push:
    tags:
      - 'napari-lumic-v*'

permissions:
  contents: read

jobs:
  build:
    name: Verify plugin release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out tagged commit and branch history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate release tag
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "The release tag must point to a commit on main." >&2
            exit 1
          fi

          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("Python/plugin/pyproject.toml").read_text(encoding="utf-8"))
          expected = f"napari-lumic-v{config['project']['version']}"
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != expected:
              raise SystemExit(f"Expected tag {expected!r} for this package version, got {tag!r}.")
          print(f"Validated {tag}.")
          PY

      - name: Build and check the source distribution and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir dist Python/plugin
          python -m twine check --strict dist/*.tar.gz dist/*.whl

      - name: Install system graphics libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1

      - name: Smoke test the installed wheel outside the checkout
        run: |
          repo="$PWD"
          cd "$(mktemp -d)"
          python -m venv wheel-env
          wheel-env/bin/python -m pip install PyQt6
          wheel-env/bin/python -m pip install "$repo"/dist/*.whl
          wheel-env/bin/python -m pip check
          wheel-env/bin/python -I - <<'PY'
          from importlib.metadata import version

          import napari
          from npe2.manifest import PluginManifest

          name = "napari-lumic-cci"
          manifest = PluginManifest.from_distribution(name)
          print(f"Installed {name} {version(name)} with lumic {version('lumic')}.")
          viewer = napari.Viewer(show=False)
          try:
              _, widget = viewer.window.add_plugin_dock_widget(manifest.name, "Spectral Unmixing")
              if widget.__class__.__name__ != "SpectralUnmixingWidget":
                  raise AssertionError(f"Unexpected widget: {type(widget)!r}")
              print("Plugin discovered and widget created successfully.")
          finally:
              viewer.close()
          PY

      - name: Store the checked distributions
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-distributions
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
