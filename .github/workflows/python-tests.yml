name: Python tests

# Always report the required check, including for documentation-only PRs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Keep this name stable: the main-branch ruleset will require this check.
    name: Python tests (unmixing-env)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        # A login shell activates the environment set up by setup-miniconda.
        shell: bash -el {0}
        working-directory: Python
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create the documented Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: unmixing-env
          auto-activate: false
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Show installed versions
        run: |
          python --version
          conda list

      - name: Verify package channels
        run: |
          python - <<'PY'
          import json
          import subprocess

          packages = json.loads(subprocess.check_output(
              ["conda", "list", "--json"], text=True))
          # The environment retains its explicit pip dependencies from PyPI.
          unexpected = [f"{p['name']}: {p.get('channel')}" for p in packages
                        if p.get("channel") not in {"conda-forge", "pypi"}]
          if unexpected:
              raise SystemExit("Unexpected package channels:\n" + "\n".join(unexpected))
          print("All packages are from conda-forge or the retained pip dependencies.")
          PY

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run the offline test suite
        run: python -m pytest

  backend-wheel:
    name: Backend wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build --outdir dist Python/lumic

      - name: Test the installed wheel outside the checkout
        shell: bash
        run: |
          repo="$PWD"
          cd "$(mktemp -d)"
          python -m venv wheel-env
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wheel_python=./wheel-env/Scripts/python.exe
          else
            wheel_python=./wheel-env/bin/python
          fi
          "$wheel_python" -m pip install "$repo"/dist/*.whl
          "$wheel_python" -m pip check
          "$wheel_python" -I "$repo/Python/ci/check_installed_backend.py"
