name: Build backend release

on:
  push:
    tags:
      - 'lumic-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify backend release artifacts
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the selected commit and branch history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "The release tag must point to a commit on main." >&2
            exit 1
          fi

          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("Python/lumic/pyproject.toml").read_text(encoding="utf-8"))
          expected = f"lumic-v{config['project']['version']}"
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != expected:
              raise SystemExit(f"Expected tag {expected!r} for this package version, got {tag!r}.")
          print(f"Validated {tag}.")
          PY

      - name: Build and check the source distribution and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir dist Python/lumic
          python -m twine check --strict dist/*.tar.gz dist/*.whl

      - name: Smoke test the installed wheel outside the checkout
        run: |
          repo="$PWD"
          cd "$(mktemp -d)"
          python -m venv wheel-env
          wheel-env/bin/python -m pip install "$repo"/dist/*.whl
          wheel-env/bin/python -m pip check
          wheel-env/bin/python -I "$repo/Python/ci/check_installed_backend.py"

      - name: Store the checked distributions
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'push' && format('{0}-distributions', github.ref_name) || format('backend-rehearsal-{0}', github.run_id) }}
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
