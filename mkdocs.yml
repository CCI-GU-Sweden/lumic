site_name: Lumic
site_url: https://cci-gu-sweden.github.io/lumic/
site_description: Spectral unmixing for fluorescence microscopy
repo_url: https://github.com/CCI-GU-Sweden/lumic
repo_name: Lumic on GitHub
hooks:
  - Python/ci/render_cos7_notebook.py
watch:
  - Python/lumic
  - Python/examples/notebooks/minimal_example.ipynb
theme:
  name: material
  features:
    - content.code.copy
extra:
  social:
    - icon: material/language-python
      link: https://pypi.org/project/lumic/
      name: Lumic backend on PyPI
    - icon: material/puzzle-outline
      link: https://pypi.org/project/napari-lumic-cci/
      name: Napari plugin on PyPI
    - icon: material/bug-outline
      link: https://github.com/CCI-GU-Sweden/lumic/issues
      name: Report an issue
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [Python]
          options:
            allow_inspection: false
            force_inspection: false
            show_source: false
            docstring_style: numpy
            heading_level: 3
nav:
  - Home: index.md
  - Backend:
      - Quickstart: backend/quickstart.md
      - Experimental data:
          - Load spectral images: backend/load-images.md
          - Load and prepare spectra: backend/load-spectra.md
          - Unmix a real experimental image (COS-7): backend/cos7-workflow.md
          - Evaluate experimental data: backend/evaluate-results.md
      - Simulated data:
          - Simulate a spectral image: backend/simulate-image.md
          - Unmix a ternary image: backend/unmix-ternary-image.md
          - Estimate unknown spectra: backend/estimate-unknown-spectra.md
          - Convex hull selection: backend/convex-hull.md
          - Spectral uniqueness maps: backend/spectral-uniqueness-maps.md
          - Recover a spectrum without pure pixels: backend/recover-hidden-spectrum.md
          - Evaluate simulation recovery: backend/evaluate-simulation-recovery.md
      - Save images and spectra: backend/save-results.md
      - API reference:
          - Overview: backend/api-overview.md
          - Image I/O: backend/image-io-api.md
          - Image containers: backend/image-containers-api.md
          - Spectra: backend/spectra-api.md
          - Unmixing and spectral selection: backend/unmixing-api.md
          - Simulation: backend/simulation-api.md
          - Evaluation: backend/evaluation-api.md
  - Napari Plugin:
      - Quickstart: plugins/overview.md
      - Load data: plugins/1-input.md
      - Select spectra: plugins/2-spectra-selection.md
      - Unmix images: plugins/3-unmixing.md
      - Evaluate results: plugins/4-evaluation.md
  - Examples: examples.md
  - Contributing:
      - Adding an image reader: contributing/adding-an-image-reader.md
